[project]
name = "adsight"
version = "0.1.0"
description = "A text-to-SQL marketing analytics agent, benchmarked across five architectures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "haider268", email = "haider268@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "duckdb>=1.5.6",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.22.0",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/haider268/adsight"
Repository = "https://github.com/haider268/adsight"

[project.scripts]
adsight = "adsight.cli:main"

[project.optional-dependencies]
probe = [
    "convoprobe",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["adsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs an API key; run with -m live"]
addopts = "-m 'not live' --cov=adsight --cov-report=term-missing"

[tool.uv.sources]
convoprobe = { git = "https://github.com/haider268/convoprobe", rev = "a5d66b5" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
